<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lift Log</title>
<meta name="description" content="Mark's lifting log: current e1RM per lift, PRs, the session journal, weekly volume per muscle, recovery, and lift videos.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one page, two shells. Under 720px a single column with a bottom tab bar;
   from 720px a fixed left rail and a content column. Numbers wear a condensed display
   face; set lines wear a mono face so they read like the notebook they came from. */
:root {
  color-scheme: light;
  --page: #f7f7f4;
  --surface-1: #fdfdfc;
  --surface-2: #f0f0ec;
  --text-primary: #0b0b0b;
  --text-secondary: #52514e;
  --text-muted: #898781;
  --grid: #e1e0d9;
  --axis: #c3c2b7;
  --border: rgba(11,11,11,0.10);
  --wash: rgba(11,11,11,0.045);
  --series-1: #2a78d6;
  --series-1-soft: rgba(42,120,214,0.30);
  --series-2: #eb6834;
  --series-2-soft: rgba(235,104,52,0.22);
  --accent-ink: #1c5cab;
  --pr: #b8860b;
  --pr-wash: rgba(237,161,0,0.14);
  --down: #c2403f;
  --font-display: "Barlow Semi Condensed", "Avenir Next Condensed", "Arial Narrow", sans-serif;
  --font-body: system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SF Mono", Menlo, monospace;
  --nav-h: 56px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --page: #0e0e0d;
    --surface-1: #1a1a19;
    --surface-2: #222221;
    --text-primary: #f0efec;
    --text-secondary: #c3c2b7;
    --text-muted: #898781;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255,255,255,0.10);
    --wash: rgba(255,255,255,0.06);
    --series-1: #3987e5;
    --series-1-soft: rgba(57,135,229,0.35);
    --series-2: #d95926;
    --series-2-soft: rgba(217,89,38,0.28);
    --accent-ink: #86b6ef;
    --pr: #eda100;
    --pr-wash: rgba(237,161,0,0.16);
    --down: #e66767;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --page: #0e0e0d;
  --surface-1: #1a1a19;
  --surface-2: #222221;
  --text-primary: #f0efec;
  --text-secondary: #c3c2b7;
  --text-muted: #898781;
  --grid: #2c2c2a;
  --axis: #383835;
  --border: rgba(255,255,255,0.10);
  --wash: rgba(255,255,255,0.06);
  --series-1: #3987e5;
  --series-1-soft: rgba(57,135,229,0.35);
  --series-2: #d95926;
  --series-2-soft: rgba(217,89,38,0.28);
  --accent-ink: #86b6ef;
  --pr: #eda100;
  --pr-wash: rgba(237,161,0,0.16);
  --down: #e66767;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--page);
  color: var(--text-primary);
  font: 15px/1.45 var(--font-body);
  -webkit-text-size-adjust: 100%;
}
a { color: inherit; }
button { font: inherit; color: inherit; }
[hidden] { display: none !important; }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--font-mono); font-size: 13.5px; }

/* ---------- shells ---------- */
.app { min-height: 100%; }
.rail {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
  display: flex; align-items: stretch;
  height: calc(var(--nav-h) + env(safe-area-inset-bottom, 0px));
  padding: 0 max(8px, env(safe-area-inset-left, 0px)) env(safe-area-inset-bottom, 0px) max(8px, env(safe-area-inset-right, 0px));
  background: var(--surface-1);
  border-top: 1px solid var(--border);
}
.rail .brand, .rail .railfoot, .rail .units { display: none; }
.rail nav { display: flex; flex: 1; gap: 2px; }
.rail nav a {
  flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  text-decoration: none; color: var(--text-muted); font-size: 11px; font-weight: 600; letter-spacing: 0.02em;
  border-radius: 10px; padding: 6px 0;
}
.rail nav a svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.rail nav a[aria-current="page"] { color: var(--text-primary); }
.rail nav a:focus-visible { outline: 2px solid var(--series-1); outline-offset: -2px; }

.main {
  padding-inline: max(16px, env(safe-area-inset-left, 0px)) max(16px, env(safe-area-inset-right, 0px));
  padding-block: 14px calc(var(--nav-h) + env(safe-area-inset-bottom, 0px) + 24px);
  max-width: 1100px;
}
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
.topbar h1 { font: 600 20px/1.1 var(--font-display); letter-spacing: 0.01em; margin: 0; text-transform: uppercase; }
.topbar .sub { color: var(--text-secondary); font-size: 13px; margin: 2px 0 0; }
.seg { display: inline-flex; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: var(--surface-1); flex: none; }
.seg button { border: 0; background: none; color: var(--text-secondary); font-size: 13px; padding: 6px 12px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--wash); color: var(--text-primary); font-weight: 600; }
.seg button:focus-visible { outline: 2px solid var(--series-1); outline-offset: -2px; }
.viewtitle { font: 600 26px/1.1 var(--font-display); text-transform: uppercase; letter-spacing: 0.01em; margin: 4px 0 12px; }
.pagefoot { color: var(--text-muted); font-size: 12px; margin-top: 28px; }

@media (min-width: 720px) {
  .app { display: grid; grid-template-columns: 184px minmax(0, 1fr); }
  .rail {
    position: sticky; top: 0; bottom: auto; left: auto; right: auto; height: 100vh;
    flex-direction: column; align-items: stretch;
    padding: 22px 14px 18px max(14px, env(safe-area-inset-left, 0px));
    border-top: 0; border-right: 1px solid var(--border);
  }
  .rail .brand { display: block; font: 600 22px/1 var(--font-display); text-transform: uppercase; letter-spacing: 0.02em; margin: 0 8px 22px; }
  .rail nav { flex-direction: column; flex: none; gap: 2px; }
  .rail nav a { flex-direction: row; justify-content: flex-start; gap: 10px; font-size: 14px; font-weight: 500; padding: 8px 10px; }
  .rail nav a[aria-current="page"] { background: var(--wash); font-weight: 600; }
  .rail nav a svg { width: 18px; height: 18px; }
  .rail .units { display: block; margin: 22px 8px 0; }
  .rail .units .label { font-size: 11px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 6px; }
  .rail .railfoot { display: block; margin-top: auto; padding: 0 8px; color: var(--text-muted); font-size: 12px; line-height: 1.4; }
  .main { padding-block: 26px 48px; padding-inline: 32px max(32px, env(safe-area-inset-right, 0px)); }
  .topbar { display: none; }
  .pagefoot { display: none; }
  .viewtitle { font-size: 30px; margin-bottom: 16px; }
}

/* ---------- common pieces ---------- */
.card { background: var(--surface-1); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; }
.stack { display: flex; flex-direction: column; gap: 14px; }
.section-h { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin: 22px 0 8px; }
.section-h h2 { font: 600 13px/1.2 var(--font-body); letter-spacing: 0.02em; color: var(--text-secondary); margin: 0; }
.section-h a { font-size: 13px; color: var(--accent-ink); text-decoration: none; }
.caption { color: var(--text-muted); font-size: 13px; margin: 0 0 10px; }
.empty { color: var(--text-muted); font-size: 14px; padding: 6px 0; }
.chips { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; padding: 2px 0 6px; margin: 0 0 10px; }
.chips::-webkit-scrollbar { display: none; }
.chip {
  flex: none; border: 1px solid var(--border); background: var(--surface-1); color: var(--text-secondary);
  border-radius: 999px; padding: 6px 12px; font-size: 13px; cursor: pointer; white-space: nowrap; text-decoration: none;
}
.chip[aria-current="true"] { background: var(--text-primary); color: var(--page); border-color: var(--text-primary); font-weight: 600; }
.chip:focus-visible { outline: 2px solid var(--series-1); outline-offset: 2px; }
.pill { display: inline-flex; align-items: center; gap: 4px; border-radius: 6px; padding: 1px 7px; font-size: 12px; background: var(--wash); color: var(--text-secondary); white-space: nowrap; }
.pill b { color: var(--text-primary); font-weight: 600; }
.delta { font-size: 13px; font-weight: 600; }
.delta.up { color: var(--accent-ink); }
.delta.down { color: var(--down); }
.delta.flat, .delta.base { color: var(--text-muted); font-weight: 500; }
.star { color: var(--pr); font-size: 0.9em; }

/* ---------- overview: lift cards ---------- */
.lifts { display: grid; grid-template-columns: 1fr; gap: 10px; }
@media (min-width: 560px) { .lifts { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (min-width: 1000px) { .lifts { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.lift {
  display: grid; grid-template-columns: minmax(0, 1fr) 112px; grid-template-rows: auto auto auto; gap: 2px 12px;
  text-align: left; cursor: pointer; text-decoration: none; color: inherit;
  transition: border-color .15s;
}
.lift:hover, .lift:focus-visible { border-color: var(--axis); outline: none; }
.lift .name { grid-column: 1; font-weight: 600; font-size: 15px; line-height: 1.25; }
.lift .big { grid-column: 1; display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.lift .big .v { font: 600 34px/1 var(--font-display); letter-spacing: -0.01em; }
.lift .big .u { color: var(--text-muted); font-size: 13px; }
.lift .spark { grid-column: 2; grid-row: 1 / span 2; align-self: center; }
.lift .spark svg { display: block; width: 112px; height: 40px; overflow: visible; }
.lift .foot { grid-column: 1 / -1; color: var(--text-secondary); font-size: 13px; margin-top: 4px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.lift .foot .cue { color: var(--text-muted); font-style: italic; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---------- journal ---------- */
.journal { display: flex; flex-direction: column; gap: 12px; }
details.sess { border-radius: 12px; }
details.sess > summary { list-style: none; cursor: pointer; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; }
details.sess > summary::-webkit-details-marker { display: none; }
details.sess > summary .d { font: 600 18px/1.2 var(--font-display); text-transform: uppercase; letter-spacing: 0.01em; }
details.sess > summary .m { color: var(--text-secondary); font-size: 13px; }
details.sess > summary .caret { margin-left: auto; color: var(--text-muted); font-size: 12px; }
details.sess[open] > summary .caret { transform: rotate(180deg); }
.pills { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 0; }
.snote { color: var(--text-secondary); font-size: 14px; margin: 10px 0 0; }
.block { margin-top: 14px; }
.block .ex { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.block .ex a { font-weight: 600; text-decoration: none; }
.block .ex a:hover { text-decoration: underline; }
.block .ex small { color: var(--text-muted); font-size: 12px; }
.block .ex .lab { font-family: var(--font-mono); font-size: 12px; color: var(--text-muted); }
.setline { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin: 4px 0 0; font-family: var(--font-mono); font-size: 13.5px; }
.setline .sep { color: var(--axis); }
.set { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; border-radius: 6px; padding: 1px 4px; margin: 0 -4px; }
.set.w { color: var(--text-muted); }
.set.w::before { content: "w"; font-size: 11px; color: var(--text-muted); }
.set .eff { color: var(--text-secondary); font-size: 12px; }
.set .typ { color: var(--text-muted); font-size: 11px; }
.set.pr { background: var(--pr-wash); }
.set .vid { border: 0; background: var(--wash); color: var(--text-secondary); border-radius: 4px; padding: 0 5px; font-size: 11px; cursor: pointer; line-height: 18px; }
.set .vid[aria-expanded="true"] { background: var(--text-primary); color: var(--page); }
.set .vid:focus-visible { outline: 2px solid var(--series-1); }
.under { color: var(--text-secondary); font-size: 13px; margin: 4px 0 0; padding-left: 2px; }
.under .cue { font-style: italic; color: var(--text-primary); }
.under .cue::before { content: "Cue: "; font-style: normal; color: var(--text-muted); }
.under .n { display: block; }
.under .n b { color: var(--text-muted); font-weight: 500; font-family: var(--font-mono); font-size: 12px; margin-right: 6px; }
.player { margin: 10px 0 2px; max-width: 480px; }
.player .frame { position: relative; aspect-ratio: 16 / 9; max-width: 100%; background: #000; border-radius: 10px; overflow: hidden; }
.player iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.player .cap { color: var(--text-muted); font-size: 12px; margin-top: 4px; }

/* ---------- lift detail ---------- */
.hero { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px 22px; }
.hero .v { font: 600 56px/0.95 var(--font-display); letter-spacing: -0.015em; }
.hero .u { font-size: 16px; color: var(--text-muted); margin-left: 6px; }
.hero .lab { font-size: 13px; font-weight: 600; color: var(--text-secondary); letter-spacing: 0.02em; }
.hero .side { display: flex; flex-direction: column; gap: 2px; color: var(--text-secondary); font-size: 13px; }
.chart { position: relative; }
.chart svg { display: block; width: 100%; overflow: visible; }
.chart svg:focus { outline: 2px solid var(--axis); outline-offset: 4px; border-radius: 4px; }
.tick { fill: var(--text-muted); font-size: 11px; font-variant-numeric: tabular-nums; }
.endlabel { fill: var(--text-primary); font-size: 12px; font-weight: 600; }
.tooltip { position: absolute; pointer-events: none; background: var(--surface-1); border: 1px solid var(--border); border-radius: 8px; padding: 6px 10px; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,0.14); white-space: nowrap; display: none; z-index: 2; }
.tooltip strong { display: block; font-size: 15px; }
.tooltip span { color: var(--text-secondary); }
.legend { display: flex; align-items: center; gap: 14px; color: var(--text-muted); font-size: 12px; margin-top: 8px; flex-wrap: wrap; }
.legend i { display: inline-block; vertical-align: middle; margin-right: 5px; }
.legend .l { width: 16px; height: 2px; background: var(--series-2); }
.legend .d { width: 9px; height: 9px; border-radius: 50%; background: var(--series-1-soft); }
.picker { display: flex; flex-wrap: wrap; gap: 10px; align-items: stretch; margin-bottom: 14px; }
.mains { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; flex: 1 1 320px; }
.mainbtn { display: flex; flex-direction: column; gap: 2px; padding: 8px 10px; border: 1px solid var(--border); border-radius: 10px; background: var(--surface-1); text-decoration: none; min-width: 0; }
.mainbtn .n { font-size: 12px; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.mainbtn .v { font: 600 22px/1 var(--font-display); }
.mainbtn .v small { font: 400 11px/1 var(--font-body); color: var(--text-muted); margin-left: 3px; }
.mainbtn[aria-current="true"] { border-color: var(--text-primary); background: var(--wash); }
.mainbtn:hover { border-color: var(--axis); }
.mainbtn:focus-visible { outline: 2px solid var(--series-1); outline-offset: 2px; }
.picker select { flex: 1 1 200px; font: inherit; font-size: 14px; padding: 8px 10px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface-1); color: var(--text-primary); max-width: 100%; min-width: 0; }
.picker select[data-active="true"] { border-color: var(--text-primary); background: var(--wash); font-weight: 600; }
.two { display: grid; grid-template-columns: 1fr; gap: 14px; }
@media (min-width: 860px) { .two { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.bars { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 6px 10px; align-items: center; }
.bars .l { font-size: 13px; color: var(--text-secondary); white-space: nowrap; }
.bars .b { height: 14px; border-radius: 0 4px 4px 0; background: var(--series-1); min-width: 2px; }
.bars .v { font-size: 13px; white-space: nowrap; }
.bars .v small { color: var(--text-muted); margin-left: 6px; }
ul.cues { margin: 0; padding-left: 18px; }
ul.cues li { margin-bottom: 4px; }
ul.cues .date { color: var(--text-muted); font-size: 12px; margin-left: 6px; }
.vids { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.vid-card { text-align: left; border: 0; background: none; padding: 0; cursor: pointer; border-radius: 8px; }
.vid-card:focus-visible { outline: 2px solid var(--series-1); outline-offset: 2px; }
.vid-card .th { position: relative; aspect-ratio: 16 / 9; border-radius: 8px; overflow: hidden; background: var(--surface-2); }
.vid-card .th img { width: 100%; height: 100%; object-fit: cover; display: block; }
.vid-card .th::after { content: "▶"; position: absolute; inset: 0; display: grid; place-items: center; color: #fff; font-size: 22px; text-shadow: 0 1px 6px rgba(0,0,0,0.6); }
.vid-card .c { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }
.vid-card .c b { color: var(--text-primary); font-weight: 600; font-family: var(--font-mono); font-size: 12px; }
.hist { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 14px; align-items: baseline; }
.hist .d { font-size: 13px; color: var(--text-secondary); white-space: nowrap; }
.hist .d a { text-decoration: none; }
.hist .s { font-family: var(--font-mono); font-size: 13px; display: flex; flex-wrap: wrap; gap: 2px 10px; }

/* ---------- load ---------- */
.heatwrap { overflow-x: auto; }
.heat { display: grid; gap: 3px; font-size: 12.5px; width: max-content; }
.heat > div { min-height: 30px; display: flex; align-items: center; }
.heat .mh { position: sticky; left: 0; background: var(--surface-1); color: var(--text-secondary); padding-right: 10px; z-index: 1; white-space: nowrap; }
.heat .wh { justify-content: center; color: var(--text-muted); white-space: nowrap; font-size: 11px; }
.heat .cell { justify-content: center; border-radius: 6px; font-variant-numeric: tabular-nums; }
.heat .mh.linkish { border: 0; font: inherit; text-align: left; cursor: pointer; border-radius: 6px; padding-left: 6px; }
.heat .mh.linkish:hover, .heat .mh.cur { color: var(--text-primary); font-weight: 600; }
.heat .wh.cur { color: var(--text-primary); font-weight: 600; }
.heat .cell.cur { outline: 2px solid var(--text-primary); outline-offset: -2px; }
.linkish { background: none; border: 0; color: var(--accent-ink); font-size: 13px; cursor: pointer; padding: 0; }
.linkish:focus-visible { outline: 2px solid var(--series-1); outline-offset: 2px; border-radius: 4px; }
.weeknav { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.weeknav .wk { width: 32px; height: 32px; border-radius: 8px; border: 1px solid var(--border); background: var(--surface-1); cursor: pointer; font-size: 18px; line-height: 1; }
.weeknav .wk:disabled { opacity: 0.35; cursor: default; }
.weeknav .wk:focus-visible { outline: 2px solid var(--series-1); }
.weeknav .wkl { flex: 1; text-align: center; font-size: 14px; color: var(--text-secondary); }
.weeknav .wkl b { color: var(--text-primary); }
.figures { display: flex; justify-content: center; gap: 4%; padding: 6px 0 2px; }
.fig { display: flex; flex-direction: column; align-items: center; gap: 4px; width: min(46%, 190px); }
.figl { font-size: 12px; color: var(--text-muted); }
.figure { display: block; width: 100%; height: auto; overflow: visible; }
.figure .sil { fill: var(--surface-2); stroke: var(--grid); stroke-width: 1; }
.figure .mus { fill: var(--surface-2); stroke: var(--surface-1); stroke-width: 1.2; cursor: pointer; transition: stroke .12s, stroke-width .12s; }
.figure .mus:hover { stroke: var(--text-secondary); stroke-width: 1.6; }
.figure .mus[aria-pressed="true"] { stroke: var(--text-primary); stroke-width: 2.2; }
.figure .mus:focus-visible { outline: none; stroke: var(--series-1); stroke-width: 2.2; }
.bignum { display: flex; align-items: baseline; gap: 8px; margin: 2px 0 10px; }
.bignum .v { font: 600 40px/1 var(--font-display); }
.bignum .u { color: var(--text-secondary); font-size: 13px; }
.weekcols { display: flex; align-items: flex-end; gap: 4px; height: 110px; }
.weekcols .wc { flex: 1; min-width: 0; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 3px; border: 0; background: none; padding: 0; cursor: pointer; }
.weekcols .wc .bar { width: 100%; max-width: 28px; background: var(--series-1-soft); border-radius: 4px 4px 0 0; }
.weekcols .wc.cur .bar { background: var(--series-1); }
.weekcols .wc .n { font-size: 11px; color: var(--text-muted); }
.weekcols .wc.cur .n { color: var(--text-primary); font-weight: 600; }
.weekcols .wc:focus-visible { outline: 2px solid var(--series-1); border-radius: 4px; }
.weekaxis { display: flex; justify-content: space-between; color: var(--text-muted); font-size: 11px; border-top: 1px solid var(--axis); padding-top: 4px; margin-top: 2px; }

<script>
(function () {
  "use strict";

  var DATA = null, EX = {}, EXLIST = [];
  var state = { unit: "kg" };

    var saved = JSON.parse(localStorage.getItem("liftlog-view") || "{}");

  } catch (e) { /* storage unavailable: defaults are fine */ }
  function remember() { try { localStorage.setItem("liftlog-view", JSON.stringify(state)); } catch (e) {} }

  // ---------- helpers ----------

  function el(tag, attrs, children) {

    Object.keys(attrs || {}).forEach(function (k) { node.setAttribute(k, attrs[k]); });

  }
  function trim(x, places) {
    var p = Math.pow(10, places == null ? 1 : places);
    return String(Math.round(x * p) / p);
  }
  function loadNum(kg) { return state.unit === "lb" ? kg * DATA.lb_per_kg : kg; }
  function load(kg, places) { return kg == null ? "—" : trim(loadNum(kg), places == null ? 1 : places) + " " + state.unit; }
  function day(d) { return new Date(d + "T12:00:00"); }
  function fmtDate(d, withYear) {
    var opts = { month: "short", day: "numeric" };
    if (withYear) opts.year = "numeric";
    return day(d).toLocaleDateString(undefined, opts);
  }
  function fmtLong(d) { return day(d).toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" }); }
  function muscles(list) { return list.map(function (m) { return m.replace(/-/g, " "); }).join(", "); }
  function niceTicks(lo, hi, count) {

  function go(hash) { location.hash = hash; }

  // A set's text in the chosen unit. Sets entered in the other unit convert when the
  // stats carry a plottable load; bodyweight lifts and multi-segment sets stay as entered.
  function setText(st) {
    var ex = EX[st.exercise_id];
    var entered = st.segments.indexOf("lb") >= 0 ? "lb" : "kg";
    if (st.load_kg == null || entered === state.unit || (ex && ex.load_type === "bodyweight")) return st.segments;
    var reps = (st.segments.match(/×([\d\/]+)/) || [])[1] || st.reps;
    return trim(loadNum(st.load_kg), 1) + state.unit + "×" + reps;
  }

  function delta(ex) {
    var h = ex.e1rm_history;
    if (!h.length) return null;
    if (h.length === 1) return { cls: "base", text: "baseline" };
    var d = h[h.length - 1].kg - h[h.length - 2].kg;
    if (Math.abs(d) < 0.05) return { cls: "flat", text: "no change" };
    return { cls: d > 0 ? "up" : "down", text: (d > 0 ? "▲ +" : "▼ −") + trim(Math.abs(loadNum(d)), 1) + " " + state.unit + " vs last" };
  }
  function deltaEl(ex) {
    var d = delta(ex);
    return d ? el("span", { class: "delta " + d.cls, text: d.text }) : null;
  }

  function sparkline(points) {

    var W = 112, H = 40, s = svg("svg", { viewBox: "0 0 " + W + " " + H, "aria-hidden": "true" });

    function x(i) { return points.length === 1 ? W - 6 : 4 + (i / (points.length - 1)) * (W - 10); }
    function y(v) { return 4 + (1 - (v - lo) / (hi - lo)) * (H - 8); }
    if (points.length > 1) {
      var d = points.map(function (p, i) { return (i ? "L" : "M") + x(i).toFixed(1) + " " + y(p.kg).toFixed(1); }).join(" ");
      s.appendChild(svg("path", { d: d + " L" + x(points.length - 1).toFixed(1) + " " + H + " L" + x(0).toFixed(1) + " " + H + " Z",
                                  fill: "var(--series-2-soft)", opacity: 0.5 }));
      s.appendChild(svg("path", { d: d, fill: "none", stroke: "var(--series-2)", "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }));
    }
    var last = points[points.length - 1];
    s.appendChild(svg("circle", { cx: x(points.length - 1), cy: y(last.kg), r: 3.5, fill: "var(--series-2)", stroke: "var(--surface-1)", "stroke-width": 2 }));
    return s;
  }

  function shortName(ex) {
    var n = ex.name;
    if (/squat/i.test(n)) return "Squat";
    if (/bench/i.test(n)) return "Bench";
    if (/deadlift/i.test(n)) return "Deadlift";
    if (/overhead|press/i.test(n)) return "Press";
    return n;
  }

  function sessionSets(exId, workingOnly) {
    // every set of one exercise across sessions, oldest session first
    var out = [];
    DATA.sessions.slice().reverse().forEach(function (s) {
      s.sets.forEach(function (st) {
        if (st.exercise_id === exId && (!workingOnly || st.type !== "warm-up")) out.push({ session: s, set: st });
      });
    });
    return out;
  }
  function bestWorkingSet(s, exId) {
    var best = null;
    s.sets.forEach(function (st) {
      if (st.exercise_id !== exId || st.type === "warm-up" || st.load_kg == null) return;
      if (!best || st.load_kg > best.load_kg || (st.load_kg === best.load_kg && st.reps > best.reps)) best = st;
    });
    return best;
  }

  // ---------- progress chart: e1RM line over working-set dots ----------

  function progressChart(host, line, dots, opts) {
    host.textContent = "";
    var wrap = el("div", { class: "chart" });
    host.appendChild(wrap);
    if (!line.length && !dots.length) { wrap.appendChild(el("p", { class: "empty", text: "Nothing logged yet." })); return; }
    var W = Math.max(280, host.clientWidth || 600), H = opts.height || 240;
    var m = { l: 44, r: 54, t: 14, b: 26 };
    var iw = W - m.l - m.r, ih = H - m.t - m.b;
    var all = line.concat(dots);
    var ts = all.map(function (p) { return day(p.date).getTime(); });
    var tMin = Math.min.apply(null, ts), tMax = Math.max.apply(null, ts), single = tMin === tMax;
    function x(d) { var t = day(d).getTime(); return single ? m.l + iw / 2 : m.l + ((t - tMin) / (tMax - tMin)) * iw; }
    var ys = all.map(function (p) { return p.y; });
    var lo = Math.min.apply(null, ys), hi = Math.max.apply(null, ys);
    var pad = (hi - lo) * 0.15 || Math.abs(hi) * 0.1 || 1; lo -= pad; hi += pad;
    var ticks = niceTicks(lo, hi, 4); lo = ticks[0]; hi = ticks[ticks.length - 1];
    function y(v) { return m.t + ih - ((v - lo) / (hi - lo)) * ih; }

    var s = svg("svg", { viewBox: "0 0 " + W + " " + H, height: H, tabindex: "0", role: "img", "aria-label": opts.label });
    ticks.forEach(function (v) {
      s.appendChild(svg("line", { x1: m.l, x2: m.l + iw, y1: y(v), y2: y(v), stroke: "var(--grid)", "stroke-width": 1 }));
      var t = svg("text", { x: m.l - 8, y: y(v) + 4, "text-anchor": "end", class: "tick" });
      t.textContent = trim(v, 0); s.appendChild(t);
    });
    s.appendChild(svg("line", { x1: m.l, x2: m.l + iw, y1: m.t + ih, y2: m.t + ih, stroke: "var(--axis)", "stroke-width": 1 }));
    var dates = all.map(function (p) { return p.date; }).filter(function (v, i, a) { return a.indexOf(v) === i; }).sort();
    var xIdx = dates.length <= 5 ? dates.map(function (_, i) { return i; })
      : [0, Math.round((dates.length - 1) / 4), Math.round((dates.length - 1) / 2), Math.round(3 * (dates.length - 1) / 4), dates.length - 1];
    xIdx.filter(function (v, i, a) { return a.indexOf(v) === i; }).forEach(function (i) {
      var t = svg("text", { x: x(dates[i]), y: H - 6, "text-anchor": "middle", class: "tick" });
      t.textContent = fmtDate(dates[i]); s.appendChild(t);
    });
    var tip = el("div", { class: "tooltip" });
    function place(px, py) {

      var scale = s.getBoundingClientRect().width / W;

      if (left + tw > wrap.clientWidth) left = px * scale - tw - 12;
      tip.style.left = Math.max(0, left) + "px";
      tip.style.top = Math.max(0, py * scale - 20) + "px";
    }
    function hideTip() { tip.style.display = "none"; cross.setAttribute("visibility", "hidden"); ring.setAttribute("visibility", "hidden"); }
    // working-set dots: faint, sized by reps, each its own hover target
    dots.forEach(function (p) {
      var r = Math.min(8, 3 + (p.reps || 1) * 0.4);
      var c = svg("circle", { cx: x(p.date), cy: y(p.y), r: r, fill: "var(--series-1-soft)", stroke: p.pr ? "var(--pr)" : "var(--surface-1)", "stroke-width": p.pr ? 2 : 1 });
      var hit = svg("circle", { cx: x(p.date), cy: y(p.y), r: Math.max(10, r + 4), fill: "transparent" });
      function show() {
        tip.textContent = "";
        tip.appendChild(el("strong", { text: p.text + (p.pr ? " ★" : "") }));
        tip.appendChild(el("span", { text: fmtDate(p.date, true) + (p.effort ? " · " + p.effort : "") }));

      hit.addEventListener("pointerleave", hideTip);
      s.appendChild(c); s.appendChild(hit);
    });
    if (line.length > 1) {
      var d = line.map(function (p, i) { return (i ? "L" : "M") + x(p.date).toFixed(1) + " " + y(p.y).toFixed(1); }).join(" ");
      s.appendChild(svg("path", { d: d, fill: "none", stroke: "var(--series-2)", "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }));
    }
    var cross = svg("line", { y1: m.t, y2: m.t + ih, stroke: "var(--axis)", "stroke-width": 1, visibility: "hidden" });
    var ring = svg("circle", { r: 7, fill: "var(--series-2)", stroke: "var(--surface-1)", "stroke-width": 2, visibility: "hidden" });
    s.appendChild(cross);
    line.forEach(function (p) {
      s.appendChild(svg("circle", { cx: x(p.date), cy: y(p.y), r: 4.5, fill: "var(--series-2)", stroke: "var(--surface-1)", "stroke-width": 2 }));
    });
    s.appendChild(ring);
    if (line.length) {
      var last = line[line.length - 1];
      var lab = svg("text", { x: x(last.date) + 10, y: y(last.y) + 4, class: "endlabel" });
      lab.textContent = trim(last.y, 1); s.appendChild(lab);
    }
    var focusIdx = line.length - 1;
    function showLine(i) {
      var p = line[i], px = x(p.date), py = y(p.y);
      cross.setAttribute("x1", px); cross.setAttribute("x2", px); cross.setAttribute("visibility", "visible");
      ring.setAttribute("cx", px); ring.setAttribute("cy", py); ring.setAttribute("visibility", "visible");
      tip.textContent = "";
      tip.appendChild(el("strong", { text: "e1RM " + trim(p.y, 1) + " " + state.unit }));
      tip.appendChild(el("span", { text: fmtDate(p.date, true) + " · from " + p.from }));
      place(px, py); focusIdx = i;
    }
    if (line.length) {
      var band = svg("rect", { x: m.l - 12, y: m.t, width: iw + 24, height: 18, fill: "transparent" });
      s.insertBefore(band, s.firstChild);
      line.forEach(function (p, i) {
        var hit = svg("circle", { cx: x(p.date), cy: y(p.y), r: 11, fill: "transparent" });
        hit.addEventListener("pointerenter", function () { showLine(i); });
        hit.addEventListener("pointerdown", function () { showLine(i); });
        hit.addEventListener("pointerleave", hideTip);
        s.appendChild(hit);
      });
      s.addEventListener("focus", function () { showLine(focusIdx); });
      s.addEventListener("blur", hideTip);
      s.addEventListener("keydown", function (e) {
        if (e.key === "ArrowLeft") { showLine(Math.max(0, focusIdx - 1)); e.preventDefault(); }
        if (e.key === "ArrowRight") { showLine(Math.min(line.length - 1, focusIdx + 1)); e.preventDefault(); }
      });
    }
    wrap.appendChild(s); wrap.appendChild(tip);
  }

  function lineChart(host, points, opts) {
    // single series small multiple with crosshair; points [{date, y}] oldest first
    host.textContent = "";
    var wrap = el("div", { class: "chart" }); host.appendChild(wrap);
    if (!points.length) { wrap.appendChild(el("p", { class: "empty", text: "Not recorded yet." })); return; }
    var W = Math.max(240, host.clientWidth || 400), H = opts.height || 150;
    var m = { l: 36, r: 46, t: 10, b: 24 }, iw = W - m.l - m.r, ih = H - m.t - m.b;
    var ts = points.map(function (p) { return day(p.date).getTime(); });
    var tMin = Math.min.apply(null, ts), tMax = Math.max.apply(null, ts), single = tMin === tMax;
    function x(t) { return single ? m.l + iw / 2 : m.l + ((t - tMin) / (tMax - tMin)) * iw; }
    var ys = points.map(function (p) { return p.y; });
    var lo = opts.dom ? opts.dom[0] : Math.min.apply(null, ys), hi = opts.dom ? opts.dom[1] : Math.max.apply(null, ys);
    if (!opts.dom) { var pad = (hi - lo) * 0.15 || Math.abs(hi) * 0.1 || 1; lo -= pad; hi += pad; }
    var ticks = niceTicks(lo, hi, 3);
    if (!opts.dom) { lo = ticks[0]; hi = ticks[ticks.length - 1]; } else ticks = ticks.filter(function (v) { return v >= lo && v <= hi; });
    function y(v) { return m.t + ih - ((v - lo) / (hi - lo)) * ih; }
    var s = svg("svg", { viewBox: "0 0 " + W + " " + H, height: H, role: "img", "aria-label": opts.label, tabindex: "0" });
    ticks.forEach(function (v) {
      s.appendChild(svg("line", { x1: m.l, x2: m.l + iw, y1: y(v), y2: y(v), stroke: "var(--grid)", "stroke-width": 1 }));
      var t = svg("text", { x: m.l - 6, y: y(v) + 4, "text-anchor": "end", class: "tick" }); t.textContent = trim(v, 0); s.appendChild(t);
    });
    s.appendChild(svg("line", { x1: m.l, x2: m.l + iw, y1: m.t + ih, y2: m.t + ih, stroke: "var(--axis)", "stroke-width": 1 }));
    [0, points.length - 1].filter(function (v, i, a) { return a.indexOf(v) === i; }).forEach(function (i) {
      var t = svg("text", { x: x(ts[i]), y: H - 6, "text-anchor": "middle", class: "tick" }); t.textContent = fmtDate(points[i].date); s.appendChild(t);
    });
    if (points.length > 1) {
      var d = points.map(function (p, i) { return (i ? "L" : "M") + x(ts[i]).toFixed(1) + " " + y(p.y).toFixed(1); }).join(" ");
      s.appendChild(svg("path", { d: d, fill: "none", stroke: "var(--series-1)", "stroke-width": 2, "stroke-linejoin": "round", "stroke-linecap": "round" }));
    }
    points.forEach(function (p, i) { s.appendChild(svg("circle", { cx: x(ts[i]), cy: y(p.y), r: 3.5, fill: "var(--series-1)", stroke: "var(--surface-1)", "stroke-width": 2 })); });
    var last = points[points.length - 1];
    var lab = svg("text", { x: x(ts[ts.length - 1]) + 8, y: y(last.y) + 4, class: "endlabel" }); lab.textContent = opts.fmt(last.y); s.appendChild(lab);
    var cross = svg("line", { y1: m.t, y2: m.t + ih, stroke: "var(--axis)", "stroke-width": 1, visibility: "hidden" });
    var ring = svg("circle", { r: 6, fill: "var(--series-1)", stroke: "var(--surface-1)", "stroke-width": 2, visibility: "hidden" });
    var hit = svg("rect", { x: m.l - 12, y: m.t, width: iw + 24, height: ih, fill: "transparent" });
    s.appendChild(cross); s.appendChild(ring); s.appendChild(hit);
    wrap.appendChild(s);
    var tip = el("div", { class: "tooltip" }); wrap.appendChild(tip);
    var focusIdx = points.length - 1;
    function show(i) {
      var p = points[i], px = x(ts[i]), py = y(p.y);
      cross.setAttribute("x1", px); cross.setAttribute("x2", px); cross.setAttribute("visibility", "visible");
      ring.setAttribute("cx", px); ring.setAttribute("cy", py); ring.setAttribute("visibility", "visible");
      tip.textContent = ""; tip.appendChild(el("strong", { text: opts.fmt(p.y) })); tip.appendChild(el("span", { text: fmtDate(p.date, true) }));
      tip.style.display = "block";
      var scale = s.getBoundingClientRect().width / W, left = px * scale + 12, tw = tip.offsetWidth;
      if (left + tw > wrap.clientWidth) left = px * scale - tw - 12;
      tip.style.left = Math.max(0, left) + "px"; tip.style.top = Math.max(0, py * scale - 20) + "px"; focusIdx = i;
    }
    function hide() { cross.setAttribute("visibility", "hidden"); ring.setAttribute("visibility", "hidden"); tip.style.display = "none"; }
    function nearest(evt) {
      var r = s.getBoundingClientRect(), px = (evt.clientX - r.left) * (W / r.width), best = 0, bd = Infinity;
      ts.forEach(function (t, i) { var dd = Math.abs(x(t) - px); if (dd < bd) { bd = dd; best = i; } });
      return best;
    }
    hit.addEventListener("pointermove", function (e) { show(nearest(e)); });
    hit.addEventListener("pointerdown", function (e) { show(nearest(e)); });
    hit.addEventListener("pointerleave", hide);
    s.addEventListener("focus", function () { show(focusIdx); }); s.addEventListener("blur", hide);
    s.addEventListener("keydown", function (e) {
      if (e.key === "ArrowLeft") { show(Math.max(0, focusIdx - 1)); e.preventDefault(); }
      if (e.key === "ArrowRight") { show(Math.min(points.length - 1, focusIdx + 1)); e.preventDefault(); }
    });
  }

  // ---------- journal (sessions) ----------

  function player(videoId, caption) {

  var loadState = { week: null, muscle: null };

  function figure(side, counts, max, onPick) {
    var s = svg("svg", { viewBox: "0 0 200 420", class: "figure", role: "group", "aria-label": side + " of body" });
    var halves = [svg("g", {}), svg("g", { transform: "matrix(-1 0 0 1 200 0)" })];
    halves.forEach(function (g) {
      ["torso", "arm", "leg"].forEach(function (k) { g.appendChild(svg("path", { d: BODY[k], class: "sil" })); });
      s.appendChild(g);
    });
    s.appendChild(svg("path", { d: BODY.head, class: "sil" }));
    halves.forEach(function (g) {
      Object.keys(BODY[side]).forEach(function (mu) {
        var n = counts[mu] || 0;
        var p = svg("path", { d: BODY[side][mu], class: "mus", "data-muscle": mu, tabindex: g === halves[0] ? "0" : "-1", role: "button",
                              "aria-label": mu.replace(/-/g, " ") + ": " + trim(n, 1) + " hard sets", "aria-pressed": String(loadState.muscle === mu) });
        if (n) p.style.fill = rampColor(n, max);
        var t = svg("title"); t.textContent = mu.replace(/-/g, " ") + " · " + trim(n, 1) + " hard sets"; p.appendChild(t);
        p.addEventListener("click", function () { onPick(mu); });
        p.addEventListener("keydown", function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); onPick(mu); } });
        g.appendChild(p);
      });
    });
    return s;
  }

  function weekOf(dateStr) {
    var d = day(dateStr), back = (d.getDay() + 6) % 7;
    d.setDate(d.getDate() - back);
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function muscleSources(mu, week) {
    // which exercises gave this muscle its hard sets in that week
    var by = {};
    DATA.sessions.forEach(function (s) {
      if (weekOf(s.date) !== week) return;
      s.sets.forEach(function (st) {
        if (st.type === "warm-up") return;
        var ex = EX[st.exercise_id]; if (!ex) return;
        var credit = ex.primary_muscles.indexOf(mu) >= 0 ? 1 : ex.secondary_muscles.indexOf(mu) >= 0 ? 0.5 : 0;
        if (!credit) return;
        (by[ex.id] = by[ex.id] || { ex: ex, sets: 0, credit: credit, total: 0 }).sets += 1;
        by[ex.id].total += credit;
      });
    });
    return Object.keys(by).map(function (k) { return by[k]; }).sort(function (a, b) { return b.total - a.total; });
  }

  function renderLoad(root) {
    root.appendChild(el("h2", { class: "viewtitle", text: "Load" }));
    var v = DATA.volume;
    if (!v.weeks.length) {
      root.appendChild(el("div", { class: "card" }, [el("p", { class: "empty", text: "No working sets yet." })]));
    } else {
      if (loadState.week == null || loadState.week >= v.weeks.length) loadState.week = v.weeks.length - 1;
      var wi = loadState.week, week = v.weeks[wi];
      var max = 10;
      v.muscles.forEach(function (mu) { v.table[mu].forEach(function (x) { if (x > max) max = x; }); });
      var counts = {};
      v.muscles.forEach(function (mu) { counts[mu] = v.table[mu][wi]; });
      function pick(mu) { loadState.muscle = loadState.muscle === mu ? null : mu; render(); }

      var mapCard = el("div", { class: "card" });
      var nav = el("div", { class: "weeknav" }, [
        el("button", { type: "button", class: "wk", "aria-label": "Earlier week", text: "‹", disabled: wi === 0 ? "" : null }),
        el("span", { class: "wkl" }, [el("b", { text: wi === v.weeks.length - 1 ? "This week" : "Week of " + fmtDate(week, true) }),
                                        el("span", { text: wi === v.weeks.length - 1 ? " · from " + fmtDate(week) : "" })]),
        el("button", { type: "button", class: "wk", "aria-label": "Later week", text: "›", disabled: wi === v.weeks.length - 1 ? "" : null })]);
      nav.children[0].addEventListener("click", function () { loadState.week = Math.max(0, wi - 1); render(); });
      nav.children[2].addEventListener("click", function () { loadState.week = Math.min(v.weeks.length - 1, wi + 1); render(); });
      mapCard.appendChild(nav);
      var figs = el("div", { class: "figures" }, [
        el("div", { class: "fig" }, [figure("front", counts, max, pick), el("span", { class: "figl", text: "Front" })]),
        el("div", { class: "fig" }, [figure("back", counts, max, pick), el("span", { class: "figl", text: "Back" })])]);
      mapCard.appendChild(figs);
      var leg = el("div", { class: "ramp" }, [el("span", { text: "0" })]);
      [0.1, 0.3, 0.5, 0.7, 0.9, 1].forEach(function (f) { var sw = el("span", { class: "sw" }); sw.style.background = rampColor(f * max, max); leg.appendChild(sw); });
      leg.appendChild(el("span", { text: trim(max, 1) + "+ hard sets · tap a muscle" }));
      mapCard.appendChild(leg);

      var detail = el("div", { class: "card" });
      var mu = loadState.muscle;
      if (!mu) {
        var top = v.muscles.map(function (m) { return { m: m, n: counts[m] }; }).filter(function (r) { return r.n > 0; }).sort(function (a, b) { return b.n - a.n; });
        detail.appendChild(el("div", { class: "section-h", style: "margin:0 0 8px" }, [el("h2", { text: (wi === v.weeks.length - 1 ? "This week" : "Week of " + fmtDate(week)) + " · hard sets" })]));
        if (!top.length) detail.appendChild(el("p", { class: "empty", text: "No hard sets logged this week." }));
        else {
          var wb = el("div", { class: "weekbars" });
          top.forEach(function (r) {
            var lbl = el("button", { type: "button", class: "l linkish", text: r.m.replace(/-/g, " ") });
            lbl.addEventListener("click", function () { pick(r.m); });
            wb.appendChild(lbl);
            var b = el("div", { class: "b" }); b.style.width = (r.n / top[0].n * 100) + "%"; wb.appendChild(b);
            wb.appendChild(el("span", { class: "v num", text: trim(r.n, 1) }));
          });
          detail.appendChild(wb);
        }
        detail.appendChild(el("p", { class: "caption", style: "margin:12px 0 0", text: "Every non-warm-up set counts 1 for its primary muscles and 0.5 for its secondary; a drop or myo-rep set is one set. Weeks start Monday." }));
      } else {
        var head = el("div", { class: "section-h", style: "margin:0 0 6px" }, [el("h2", { text: mu.replace(/-/g, " ") })]);
        var clear = el("button", { type: "button", class: "linkish", text: "Clear" }); clear.addEventListener("click", function () { pick(mu); });
        head.appendChild(clear); detail.appendChild(head);
        detail.appendChild(el("div", { class: "bignum" }, [el("span", { class: "v num", text: trim(counts[mu] || 0, 1) }), el("span", { class: "u", text: "hard sets · " + (wi === v.weeks.length - 1 ? "this week" : "week of " + fmtDate(week)) })]));
        var hist = v.table[mu], hmax = Math.max(1, Math.max.apply(null, hist));
        var cols = el("div", { class: "weekcols", role: "img", "aria-label": "Hard sets per week for " + mu });
        hist.forEach(function (n, i) {
          var col = el("button", { type: "button", class: "wc" + (i === wi ? " cur" : ""), title: fmtDate(v.weeks[i], true) + ": " + trim(n, 1) + " sets", "aria-label": fmtDate(v.weeks[i], true) + ": " + trim(n, 1) + " sets" });
          var bar = el("div", { class: "bar" }); bar.style.height = Math.max(2, n / hmax * 100) + "%"; col.appendChild(bar);
          col.appendChild(el("span", { class: "n num", text: n ? trim(n, 1) : "" }));
          col.addEventListener("click", function () { loadState.week = i; render(); });
          cols.appendChild(col);
        });
        detail.appendChild(cols);
        detail.appendChild(el("div", { class: "weekaxis" }, [el("span", { text: fmtDate(v.weeks[0]) }), el("span", { text: v.weeks.length > 1 ? fmtDate(v.weeks[v.weeks.length - 1]) : "" })]));
        var src = muscleSources(mu, week);
        detail.appendChild(el("div", { class: "section-h", style: "margin:14px 0 6px" }, [el("h2", { text: "From" })]));
        if (!src.length) detail.appendChild(el("p", { class: "empty", text: "Nothing hit this muscle that week." }));
        else detail.appendChild(el("div", { class: "hist" }, src.reduce(function (acc, r) {
          return acc.concat([el("span", { class: "d num", text: trim(r.total, 1) }),
                             el("span", { class: "s", style: "font-family:var(--font-body);font-size:14px" }, [
                               el("a", { href: "#lift/" + r.ex.id, text: r.ex.name, style: "text-decoration:none" }),
                               el("span", { style: "color:var(--text-muted)", text: " " + r.sets + (r.sets === 1 ? " set" : " sets") + (r.credit === 0.5 ? " · secondary" : "") })])]); }, [])));
      }
      root.appendChild(el("div", { class: "two" }, [mapCard, detail]));

      var card = el("div", { class: "card", style: "margin-top:14px" }, [el("div", { class: "section-h", style: "margin:0 0 8px" }, [el("h2", { text: "Hard sets per muscle, by week" })])]);
      var grid = el("div", { class: "heat", role: "table" });
      grid.style.gridTemplateColumns = "auto repeat(" + v.weeks.length + ", 46px)";
      grid.appendChild(el("div", { class: "mh", role: "columnheader", text: "" }));
      v.weeks.forEach(function (w, i) { grid.appendChild(el("div", { class: "wh" + (i === wi ? " cur" : ""), role: "columnheader", text: fmtDate(w) })); });
      v.muscles.forEach(function (m) {
        var rh = el("button", { type: "button", class: "mh linkish" + (m === mu ? " cur" : ""), role: "rowheader", text: m.replace(/-/g, " "), "aria-pressed": String(m === mu) });
        rh.addEventListener("click", function () { pick(m); });
        grid.appendChild(rh);
        v.table[m].forEach(function (x, i) {
          var c = el("div", { class: "cell" + (m === mu ? " cur" : ""), role: "cell", text: x ? trim(x, 1) : "", title: m.replace(/-/g, " ") + ", week of " + fmtDate(v.weeks[i], true) + ": " + trim(x, 1) + " sets" });
          if (x) { var col = rampColor(x, max); c.style.background = col; c.style.color = inkFor(col); }
          grid.appendChild(c);
        });
      });
      card.appendChild(el("div", { class: "heatwrap" }, [grid]));
      root.appendChild(card);
    }

    root.appendChild(el("div", { class: "section-h" }, [el("h2", { text: "Recovery and session load" })]));
    var sess = DATA.sessions.slice().reverse();
    var grid2 = el("div", { class: "small-multiples" }); root.appendChild(grid2);
    var metrics = [
      { key: "readiness", title: "Readiness", dom: [1, 10], fmt: function (v) { return trim(v, 1); } },
      { key: "sleep_score", title: "Sleep score", dom: [0, 100], fmt: function (v) { return trim(v, 0); } },
      { key: "hrv_ms", title: "HRV", fmt: function (v) { return trim(v, 0) + " ms"; } },
      { key: "session_rpe", title: "Session RPE", dom: [1, 10], fmt: function (v) { return trim(v, 1); } },
      { key: "training_load", title: "Training load (sRPE × minutes)", fmt: function (v) { return trim(v, 0); } },
      { key: "bodyweight_kg", title: "Bodyweight", conv: true, fmt: function (v) { return trim(v, 1) + " " + state.unit; } },
    ];
    var hosts = [];
    metrics.forEach(function (mt) {
      var host = el("div"); grid2.appendChild(el("div", { class: "card" }, [el("h3", { text: mt.title }), host])); hosts.push([host, mt]);
    });
    hosts.forEach(function (pair) {
      var mt = pair[1];
      var pts = sess.filter(function (s) { return s[mt.key] != null; }).map(function (s) { return { date: s.date, y: mt.conv ? loadNum(s[mt.key]) : s[mt.key] }; });
      lineChart(pair[0], pts, { height: 140, dom: mt.dom, fmt: mt.fmt, label: mt.title });
    });
    var det = el("details", { class: "card plain", style: "margin-top:14px" }, [el("summary", { text: "Table" })]);
    var t = el("table");
    var tr = el("tr");
    ["Date", "Readiness", "Sleep", "HRV", "sRPE", "Minutes", "Load", "Bodyweight"].forEach(function (h, i) { tr.appendChild(el("th", { text: h, class: i ? "num" : "" })); });
    t.appendChild(el("thead", null, [tr]));
    var tb = el("tbody");
    DATA.sessions.forEach(function (s) {
      var row = el("tr");
      [fmtDate(s.date, true), s.readiness, s.sleep_score, s.hrv_ms, s.session_rpe, s.minutes, s.training_load, s.bodyweight_kg != null ? load(s.bodyweight_kg) : null]
        .forEach(function (c, i) { row.appendChild(el("td", { text: c == null ? "—" : String(c), class: i ? "num" : "" })); });
      tb.appendChild(row);
    });
    t.appendChild(tb);
    det.appendChild(el("div", { class: "scrollx", style: "margin-top:8px" }, [t]));
    root.appendChild(det);
  }

  // ---------- shell and routing ----------

  function route() {
    var h = (location.hash || "#overview").slice(1).split("/");
    var view = h[0], arg = h.slice(1).join("/");
    if (view === "session") { view = "sessions"; }
    if (["overview", "lift", "sessions", "load"].indexOf(view) < 0) view = "overview";
    return { view: view, arg: arg, raw: h[0] };
  }

  function render() {
    var root = document.getElementById("view");
    root.textContent = "";
    if (!DATA) return;
    var r = route();
    document.querySelectorAll(".rail nav a").forEach(function (a) {
      if (a.dataset.view === r.view) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current");
    });
    if (r.view === "overview") renderOverview(root);
    else if (r.view === "lift") renderLift(root, r.arg);
    else if (r.view === "sessions") renderSessions(root, r.raw === "session" ? r.arg : null);
    else renderLoad(root);
    if (r.raw !== "session") window.scrollTo(0, 0);
  }

  function renderShell() {
    var s = DATA.sessions[0];
    var line = s ? DATA.sessions.length + " session" + (DATA.sessions.length === 1 ? "" : "s") + " · last " + fmtLong(s.date) + (s.location ? " at " + s.location : "") : "No sessions logged yet.";
    document.getElementById("summary").textContent = line;
    var refreshed = "Data refreshed " + new Date(DATA.generated).toLocaleString(undefined, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) + ".";
    document.getElementById("railfoot").textContent = line + " " + refreshed;
    document.getElementById("pagefoot").textContent = refreshed + " Loads follow the unit toggle; bodyweight and multi-part sets show as entered.";
  }

  document.querySelectorAll(".seg button").forEach(function (b) {
    b.addEventListener("click", function () {
      state.unit = b.dataset.unit; remember();
      document.querySelectorAll(".seg button").forEach(function (o) { o.setAttribute("aria-pressed", String(o.dataset.unit === state.unit)); });
      render();
    });
    b.setAttribute("aria-pressed", String(b.dataset.unit === state.unit));
  });
  var resizeTimer = null;
  window.addEventListener("resize", function () { clearTimeout(resizeTimer); resizeTimer = setTimeout(render, 150); });
  window.addEventListener("hashchange", render);
  if (window.matchMedia) {
    var mq = window.matchMedia("(prefers-color-scheme: dark)");
    if (mq.addEventListener) mq.addEventListener("change", render);
  }

  fetch("data/stats.json", { cache: "no-cache" })
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function (d) {
      DATA = d; EXLIST = d.exercises; EX = {};
      d.exercises.forEach(function (e) { EX[e.id] = e; });
      if (!location.hash) history.replaceState(null, "", "#overview");
      renderShell(); render();
    })
    .catch(function () {
      document.getElementById("summary").textContent = "Couldn't load data/stats.json. Open this page through GitHub Pages or a local web server, not as a file.";
      document.getElementById("view").appendChild(el("p", { class: "empty", text: "Couldn't load data/stats.json. Open this page through GitHub Pages or a local web server, not as a file." }));
    });
})();
</script>
</body>
</html>
